[workspace]
members = [
    "crates/shared_core",
    "crates/client",
    "crates/admin",
]
resolver = "2"

[workspace.dependencies]
eframe = "0.33.3"
egui = "0.33.3"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

shared_core = { path = "crates/shared_core", package = "pisofocus-shared_core" }